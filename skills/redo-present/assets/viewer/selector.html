<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Выбор слайдов</title><link rel="stylesheet" href="studio.css"></head><body>
<header><strong>Presentation Studio</strong><span id="project"></span><span id="progress" aria-live="polite"></span></header>
<div class="workspace"><aside><p class="eyebrow">Слайды</p><nav id="slides" aria-label="Слайды презентации"></nav></aside><main id="deck" aria-label="Презентация"></main></div>
<footer class="result"><label for="selection">Ваш выбор</label><textarea id="selection" readonly aria-label="Список выбранных вариантов"></textarea><button id="copy">Скопировать выбор</button><button id="download">Скачать выбор</button><p id="notice" role="status">В каждом слайде выбран первый вариант. Нажмите другой, чтобы заменить.</p></footer>
<script src="studio-data.js"></script><script src="studio.js"></script></body></html>
